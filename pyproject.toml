[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mini-vllm"
version = "0.1.0"
description = "Minimal inference infra learning scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "toy/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
