[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mini-vllm"
version = "0.1.0"
description = "Minimal inference infra learning scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=4.51.3,<4.52",
]

[project.scripts]
llm-generate = "llm.runtime.generate:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "toy/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.hatch.build.targets.sdist]
include = ["/src/llm", "/pyproject.toml", "/README.md"]
